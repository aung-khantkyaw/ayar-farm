version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env
    restart: always

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5173:4173"
    env_file:
      - ./web/.env
    depends_on:
      - api
    restart: always

  mobile:
    build:
      context: .
      dockerfile: Dockerfile.mobile
    ports:
      - "5174:80"
    restart: always

  database:
    build:
      context: .
      dockerfile: Dockerfile.database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
