services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env
    depends_on:
      - database
    restart: always

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "4173:4173"
    env_file:
      - ./web/.env
    depends_on:
      - api
    restart: always

  mobile:
    build:
      context: .
      dockerfile: docker/Dockerfile.mobile
    ports:
      - "80:80"
    restart: always

  ai-processor:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai-processor
    ports:
      - "8001:8001"
    env_file:
      - ./ai-processor/.env
    depends_on:
      - database
      - redis
      - qdrant
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  database:
    build:
      context: .
      dockerfile: docker/Dockerfile.database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
