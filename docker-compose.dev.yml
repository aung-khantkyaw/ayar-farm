services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env
    volumes:
      - ./api:/app
      - /app/node_modules
    command: npm run dev
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "5173:5173"
    env_file:
      - ./web/.env
    volumes:
      - ./web:/app
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      - api
    restart: unless-stopped

  ai-processor:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai-processor
    ports:
      - "8001:8001"
    env_file:
      - ./ai-processor/.env
    volumes:
      - ./ai-processor:/app
    depends_on:
      - database
      - redis
      - qdrant
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  mobile:
    build:
      context: .
      dockerfile: docker/Dockerfile.mobile
      target: dev
    ports:
      - "8080:8080"
    volumes:
      - ./mobile:/app
    stdin_open: true
    tty: true
    command: /bin/bash -c "flutter pub get && flutter run -d web-server --web-port 8080 --web-hostname 0.0.0.0"
    restart: unless-stopped

  database:
    build:
      context: .
      dockerfile: docker/Dockerfile.database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
