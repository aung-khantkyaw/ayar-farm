services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: local_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ayar_farm_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: local_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:alpine
    container_name: local_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama
    container_name: local_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  api:
    build:
      context: ./apps/api
      dockerfile: ../../docker/Dockerfile.node
    container_name: node_api
    ports:
      - "4000:4000"
    env_file:
      - .env.local
    depends_on:
      - postgres
      - redis
      - qdrant

  ai-processor:
    build:
      context: ./services/ai-processor
      dockerfile: ../../docker/Dockerfile.python
    container_name: python_ai_worker
    env_file:
      - .env.local
    depends_on:
      - postgres
      - redis
      - qdrant

volumes:
  pg_data:
  qdrant_data:
  ollama_data:
  redis_data:
